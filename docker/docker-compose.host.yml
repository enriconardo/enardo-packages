# Temporary overlay, for stage 1 of the dev container task: the binds that the
# main compose file no longer has (under Clone in Volume they cannot resolve).
# Only dev.sh adds it, with a second -f. Deleted in stage 2.
services:
  dev:
    volumes:
      # Relative to this file, so the repo works wherever it is cloned.
      - ..:/workspaces/enardo-packages
      # Only the git identity: no SSH key and no credential enters this
      # container on the host.
      - ${HOME}/.gitconfig:/home/node/.gitconfig:ro
      # Compose merges volumes by target: this covers the claude-config volume
      # of the main file, so the container of dev.sh (no firewall) holds no
      # Claude login, and dependencies' code run there cannot reach one.
      - type: tmpfs
        target: /home/node/.claude
